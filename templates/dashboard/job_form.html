{% extends "dashboard_base.html" %}
{% block dash_content %}
<h1>{% if job %}Edit job{% else %}Post a job{% endif %}</h1>
<div class="card">
  {% if form.non_field_errors %}<ul class="messages">{% for e in form.non_field_errors %}<li class="error">{{ e }}</li>{% endfor %}</ul>{% endif %}
  <form method="post"><div class="grid-2">{% csrf_token %}
  {% for field in form %}<label>{{ field.label }}{{ field }}{% for e in field.errors %}<small style="color:#e11d48">{{ e }}</small>{% endfor %}</label>{% endfor %}
</div><button class="btn" type="submit">Save job</button></form></div>
{% endblock %}
