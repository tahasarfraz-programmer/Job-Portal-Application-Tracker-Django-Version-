{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width:420px;padding:2rem 1rem">
  <div class="card">
    <h1>Log in to Hirewell</h1>
    {% if form.non_field_errors %}<ul class="messages">{% for e in form.non_field_errors %}<li class="error">{{ e }}</li>{% endfor %}</ul>{% endif %}
    <form method="post">{% csrf_token %}
      {% for field in form %}<label>{{ field.label }}{{ field }}{% for e in field.errors %}<small style="color:#e11d48">{{ e }}</small>{% endfor %}</label>{% endfor %}
      <button class="btn" style="width:100%" type="submit">Log in</button>
    </form>
    <p style="margin-top:1rem">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p>
  </div>
</div>
{% endblock %}
