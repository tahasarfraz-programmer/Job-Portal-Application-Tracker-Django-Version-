{% extends "dashboard_base.html" %}
{% block dash_content %}
<h1>Company profile</h1>
<div class="card">
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    <div class="grid-2">{% for field in form %}<label>{{ field.label }}{{ field }}{% for e in field.errors %}<small style="color:#e11d48">{{ e }}</small>{% endfor %}</label>{% endfor %}</div>
    <button class="btn" type="submit">Save company</button>
  </form>
</div>
{% endblock %}
